<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ОГЭ — Конструктор своего варианта</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script src="../../js/theme.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <h1>ОГЭ</h1>
        <div class="site-header__tail">
          <nav>
            <a href="../../index.html">Главная</a>
            <a href="../topics/index.html">Темы</a>
            <a href="../tables.html">Таблицы</a>
            <a href="index.html">ОГЭ</a>
          </nav>
          <button
            type="button"
            class="theme-toggle"
            aria-label="Включить светлую тему"
          >
            <span class="material-symbols-outlined" aria-hidden="true"
              >light_mode</span
            >
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <article class="card">
        <p><a href="index.html">← К списку заданий ОГЭ</a></p>
        <h2>Конструктор своего варианта</h2>
        <p class="lead">
          Укажите, сколько заданий каждого типа нужно, и получите ссылки на
          случайно выбранные примеры из банка — например для отработки
          конкретной темы или для домашней работы.
        </p>

        <p class="oge-builder-actions">
          <button
            type="button"
            id="fillOnesBtn"
            class="btn-secondary"
            data-task-dir="../../data/oge/tasks/"
          >
            Всех по 1
          </button>
          <button type="button" id="clearCountsBtn" class="btn-secondary">
            Очистить
          </button>
        </p>

        <table class="oge-builder-table" id="builderTable">
          <thead>
            <tr>
              <th>Тип задания</th>
              <th>Сколько взять</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <p style="margin-top: 16px">
          <label>
            <input type="checkbox" id="onlyHard" />
            только задания <span class="oge-hard">★</span> повышенной сложности
          </label>
        </p>

        <p style="margin-top: 16px">
          <button type="button" id="buildBtn">Собрать</button>
        </p>

        <div id="builderResult" role="status"></div>
      </article>
    </main>
    <script src="../../js/oge-check-feedback.js"></script>
    <script src="../../js/oge-render-client.js"></script>
    <script src="../../js/oge-task-builder.js"></script>
  </body>
</html>
